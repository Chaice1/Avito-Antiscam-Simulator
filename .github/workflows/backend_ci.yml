name: Backend CI


on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Download Dependencies
      run: go mod download

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Run GolangCI-Lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.59.1
        working-directory: backend
        args: --timeout=5m
