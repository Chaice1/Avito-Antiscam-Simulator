version: '3.8'

services:
  app:
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_NAME=Avito Antiscam Trainer
      - REDIS_ADDRESS=redis:6379
      - HTTP_ADDRESS=:8080
      - TTL=15 
    depends_on:
      - redis
    volumes:
      - ./backend/scenarios:/app/scenarios

  redis:
    image: redis:7-alpine
    ports:
      - "6379-6379"